<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vocabulary Quiz 1 — Hotel Facilities</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    :root{--purple-dark:#26215C;--purple-main:#534AB7;--purple-light:#CECBF6;--purple-pale:#EEEDFE;--teal-dark:#085041;--teal-main:#0F6E56;--teal-pale:#E1F5EE;--coral-dark:#712B13;--coral-main:#993C1D;--coral-pale:#FAECE7;--green-main:#3B6D11;--green-pale:#EAF3DE;--green-light:#C0DD97;--bg:#F0EEF8;--radius:14px;--radius-sm:10px;}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);}
    #quizScreen{height:100%;display:flex;flex-direction:column;}
    .header{background:var(--green-main);padding:10px 18px 16px;flex-shrink:0;}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .back-btn{display:flex;align-items:center;gap:5px;color:var(--green-light);font-size:13px;cursor:pointer;text-decoration:none;}
    .back-btn i{font-size:16px;}
    .home-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);color:#fff;font-size:12px;font-weight:500;padding:6px 13px;border-radius:20px;cursor:pointer;text-decoration:none;}
    .home-btn i{font-size:14px;}
    .progress-row{display:flex;align-items:center;gap:10px;}
    .progress-track{flex:1;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;overflow:hidden;}
    .progress-fill{height:100%;background:#fff;border-radius:3px;transition:width 0.4s ease;width:0%;}
    .progress-label{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;min-width:40px;text-align:right;}
    .scroll{flex:1;overflow-y:auto;padding:20px 16px 30px;-webkit-overflow-scrolling:touch;}
    .scroll::-webkit-scrollbar{width:0;}
    .word-bank-box{background:#fff;border-radius:var(--radius-sm);padding:12px 14px;border:0.5px solid var(--green-light);margin-bottom:16px;}
    .wb-label{font-size:10px;font-weight:600;color:var(--green-main);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
    .wb-words{display:flex;flex-wrap:wrap;gap:6px;}
    .wb-word{background:var(--green-pale);color:var(--green-main);font-size:13px;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid var(--green-light);}
    .qtopic{font-size:11px;font-weight:600;color:var(--green-main);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;}
    .qlabel{font-size:13px;color:#888;margin-bottom:12px;font-style:italic;line-height:1.5;}
    .passage{background:#fff;border-radius:var(--radius-sm);padding:14px 16px;border:0.5px solid var(--purple-light);font-size:16px;font-weight:500;color:var(--purple-dark);line-height:1.8;margin-bottom:16px;}
    .input-label{font-size:11px;font-weight:600;color:var(--green-main);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
    .answer-input{width:100%;background:#fff;border:2px solid var(--purple-light);border-radius:var(--radius);padding:14px 16px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--purple-dark);outline:none;transition:border-color 0.2s;margin-bottom:16px;}
    .answer-input:focus{border-color:var(--green-main);}
    .answer-input.correct{border-color:var(--teal-main);background:var(--teal-pale);color:var(--teal-dark);}
    .answer-input.wrong{border-color:var(--coral-main);background:var(--coral-pale);color:var(--coral-dark);}
    .feedback-box{border-radius:var(--radius-sm);padding:12px 14px;display:none;align-items:flex-start;gap:9px;margin-bottom:18px;animation:fadeUp 0.25s ease both;}
    .feedback-box.show{display:flex;}
    .feedback-box.correct-fb{background:var(--teal-pale);}
    .feedback-box.wrong-fb{background:var(--coral-pale);}
    .fb-icon{font-size:17px;flex-shrink:0;}
    .fb-text{font-size:13px;line-height:1.55;}
    .feedback-box.correct-fb .fb-text{color:var(--teal-dark);}
    .feedback-box.wrong-fb .fb-text{color:var(--coral-dark);}
    .check-btn{width:100%;background:var(--green-main);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;transition:opacity 0.2s;}
    .check-btn:disabled{opacity:0.35;cursor:not-allowed;}
    .check-btn i{font-size:17px;}
    .next-btn{width:100%;background:var(--green-main);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600;cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px;animation:fadeUp 0.25s ease both;}
    .next-btn.show{display:flex;}
    .next-btn i{font-size:17px;}
    #resultScreen{display:none;flex-direction:column;height:100%;}
    #resultScreen.show{display:flex;}
    .result-header{background:var(--green-main);padding:10px 18px 16px;flex-shrink:0;}
    .result-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .result-scroll{flex:1;overflow-y:auto;padding:24px 18px 30px;display:flex;flex-direction:column;align-items:center;}
    .result-emoji{font-size:54px;text-align:center;margin-bottom:10px;}
    .result-title{font-size:21px;font-weight:700;color:var(--purple-dark);text-align:center;margin-bottom:4px;}
    .result-sub{font-size:13px;color:#999;text-align:center;margin-bottom:24px;}
    .score-circle{width:116px;height:116px;border-radius:50%;background:var(--green-pale);border:4px solid var(--green-main);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;}
    .score-num{font-size:32px;font-weight:700;color:var(--green-main);line-height:1;}
    .score-lbl{font-size:11px;color:#888;margin-top:4px;}
    .result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-bottom:24px;}
    .rstat{background:#fff;border-radius:var(--radius-sm);padding:12px 10px;text-align:center;border:0.5px solid #E0DEFA;}
    .rstat-val{font-size:20px;font-weight:700;}
    .rstat-lbl{font-size:10px;color:#888;margin-top:3px;}
    .rstat.c .rstat-val{color:var(--teal-main);}
    .rstat.w .rstat-val{color:var(--coral-main);}
    .rstat.a .rstat-val{color:var(--green-main);}
    .result-btns{display:flex;flex-direction:column;gap:9px;width:100%;}
    .btn-retry{width:100%;background:var(--green-main);color:#fff;border:none;border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
    .btn-back{width:100%;background:#fff;color:var(--green-main);border:1.5px solid var(--green-light);border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
    .btn-retry i,.btn-back i{font-size:17px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
<div id="quizScreen">
  <div class="header">
    <div class="header-top">
      <a class="back-btn" href="./index.html"><i class="ti ti-arrow-left"></i> Vocabulary</a>
      <a class="home-btn" href="../index.html"><i class="ti ti-home"></i> Main menu</a>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">0 / 9</span>
    </div>
  </div>
  <div class="scroll" id="quizScroll">
    <div class="qtopic">Vocabulary — Hotel Facilities</div>
    <div class="qlabel">Complete the gap with the correct word from the word bank.</div>
    <div class="word-bank-box">
      <div class="wb-label">Word bank</div>
      <div class="wb-words">
        <span class="wb-word">gym</span><span class="wb-word">lift</span><span class="wb-word">car park</span>
        <span class="wb-word">Wi-Fi</span><span class="wb-word">towels</span><span class="wb-word">safe</span>
        <span class="wb-word">refreshments</span><span class="wb-word">bath</span><span class="wb-word">restaurant</span>
      </div>
    </div>
    <div class="passage" id="passage"></div>
    <div class="input-label">Your answer</div>
    <input class="answer-input" id="answerInput" type="text" placeholder="Type the missing word..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <div class="feedback-box" id="feedbackBox">
      <span class="fb-icon" id="fbIcon"></span>
      <div class="fb-text" id="fbText"></div>
    </div>
    <button class="check-btn" id="checkBtn" onclick="checkAnswer()" disabled><i class="ti ti-check"></i> Check answer</button>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next question <i class="ti ti-arrow-right"></i></button>
  </div>
</div>
<div id="resultScreen">
  <div class="result-header">
    <div class="result-header-top">
      <a class="back-btn" href="./index.html"><i class="ti ti-arrow-left"></i> Vocabulary</a>
      <a class="home-btn" href="../index.html"><i class="ti ti-home"></i> Main menu</a>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
      <span class="progress-label">9 / 9</span>
    </div>
  </div>
  <div class="result-scroll">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title">Quiz complete!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="score-circle">
      <div class="score-num" id="scoreNum"></div>
      <div class="score-lbl">Your score</div>
    </div>
    <div class="result-stats">
      <div class="rstat c"><div class="rstat-val" id="resCorrect">0</div><div class="rstat-lbl">Correct</div></div>
      <div class="rstat w"><div class="rstat-val" id="resWrong">0</div><div class="rstat-lbl">Wrong</div></div>
      <div class="rstat a"><div class="rstat-val" id="resAttempts">0</div><div class="rstat-lbl">Attempts</div></div>
    </div>
    <div class="result-btns">
      <button class="btn-retry" onclick="retryQuiz()"><i class="ti ti-refresh"></i> Try again</button>
      <button class="btn-back" onclick="window.location.href='./index.html'"><i class="ti ti-list"></i> Back to Vocabulary</button>
    </div>
  </div>
</div>
<script>
  const SUPABASE_URL='https://wfpphviaosfedotbivtb.supabase.co';
  const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHBodmlhb3NmZWRvdGJpdnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjI0MzgsImV4cCI6MjA5NTYzODQzOH0.HyY11YK2hjmRogCGMKcB_s6EpwGM7OQbFtR7HNTLryQ';
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const tg=window.Telegram?.WebApp;
  tg?.ready();tg?.expand();

  const ALL_QUESTIONS=[
    // lift (4)
    {q:'The hotel has six floors but no _____ — you have to use the stairs.',accepted:['lift'],explanation:'A <strong>lift</strong> is the machine that moves people between floors.'},
    {q:'I\'m on the 8th floor, so I always take the _____ .',accepted:['lift'],explanation:'A <strong>lift</strong> carries people up and down between floors.'},
    {q:'There is a _____ next to the stairs on every floor.',accepted:['lift'],explanation:'A <strong>lift</strong> is used to travel between floors without using stairs.'},
    {q:'The _____ was broken, so we walked up five floors with our bags.',accepted:['lift'],explanation:'A <strong>lift</strong> is an elevator — it moves between floors of a building.'},
    // wi-fi (4)
    {q:'The hotel offers free _____ in all rooms so guests can use the internet.',accepted:['wi-fi','wifi','wi fi'],explanation:'<strong>Wi-Fi</strong> is wireless internet access.'},
    {q:'I use the hotel _____ to check my emails every morning.',accepted:['wi-fi','wifi','wi fi'],explanation:'<strong>Wi-Fi</strong> allows you to connect to the internet wirelessly.'},
    {q:'Is there free _____ in the room? I need to work online.',accepted:['wi-fi','wifi','wi fi'],explanation:'<strong>Wi-Fi</strong> is the internet connection provided in hotels.'},
    {q:'The _____ password is written on a card next to the TV.',accepted:['wi-fi','wifi','wi fi'],explanation:'<strong>Wi-Fi</strong> needs a password to connect.'},
    // safe (4)
    {q:'Keep your passport in the room _____ when you go out.',accepted:['safe'],explanation:'A <strong>safe</strong> is a locked metal box for valuables.'},
    {q:'There is a small _____ in the wardrobe for your money and documents.',accepted:['safe'],explanation:'A <strong>safe</strong> keeps your valuables locked and secure.'},
    {q:'I put my laptop in the _____ before I left the hotel room.',accepted:['safe'],explanation:'A <strong>safe</strong> is a secure box inside the room.'},
    {q:'The _____ in my room has a four-digit code.',accepted:['safe'],explanation:'A <strong>safe</strong> is a locked box you can use to store valuables.'},
    // refreshments (4)
    {q:'There are _____ in the minibar — water, juice and some snacks.',accepted:['refreshments'],explanation:'<strong>Refreshments</strong> are drinks and light snacks.'},
    {q:'The minibar has got _____ including cold drinks and chocolate.',accepted:['refreshments'],explanation:'<strong>Refreshments</strong> in a minibar are drinks and snacks.'},
    {q:'Guests can help themselves to _____ from the minibar at any time.',accepted:['refreshments'],explanation:'<strong>Refreshments</strong> are food and drinks available for guests.'},
    {q:'The hotel provides free _____ in the lobby — tea, coffee and water.',accepted:['refreshments'],explanation:'<strong>Refreshments</strong> are drinks and snacks provided for guests.'},
    // bath (5)
    {q:'The bathroom has a shower and a _____ .',accepted:['bath'],explanation:'A <strong>bath</strong> is the large tub you fill with water to wash in.'},
    {q:'I love hotels with a _____ — I enjoy a long soak after travelling.',accepted:['bath'],explanation:'A <strong>bath</strong> is a large tub filled with water for washing.'},
    {q:'The room has a _____ and a separate shower cubicle.',accepted:['bath'],explanation:'A <strong>bath</strong> is the bathtub in the bathroom.'},
    {q:'There is no _____ in this room — only a shower.',accepted:['bath'],explanation:'A <strong>bath</strong> is a large tub — not all rooms have one.'},
    {q:'She ran a hot _____ and relaxed after a long day of travelling.',accepted:['bath'],explanation:'A <strong>bath</strong> is a tub of water you sit in to wash.'},
    // towels (5)
    {q:'Clean _____ are placed in the bathroom every morning.',accepted:['towels'],explanation:'<strong>Towels</strong> are large pieces of cloth used to dry yourself.'},
    {q:'There are fresh _____ in the cupboard next to the bathroom.',accepted:['towels'],explanation:'<strong>Towels</strong> are what you use to dry off after a shower.'},
    {q:'The housekeeping team replaced our _____ while we were at breakfast.',accepted:['towels'],explanation:'<strong>Towels</strong> are replaced by hotel staff daily.'},
    {q:'Could you bring extra _____ to our room, please?',accepted:['towels'],explanation:'<strong>Towels</strong> are cloth items for drying after bathing.'},
    {q:'The _____ in this hotel are very soft and clean.',accepted:['towels'],explanation:'<strong>Towels</strong> are provided in hotel bathrooms for drying.'},
    // restaurant (4)
    {q:'There is a _____ on the ground floor where breakfast is served.',accepted:['restaurant'],explanation:'A <strong>restaurant</strong> is where meals are served.'},
    {q:'The hotel _____ is open from 7am to 10pm every day.',accepted:['restaurant'],explanation:'A hotel <strong>restaurant</strong> serves meals to guests.'},
    {q:'We had dinner at the hotel _____ — the food was excellent.',accepted:['restaurant'],explanation:'A <strong>restaurant</strong> is a place in the hotel for eating meals.'},
    {q:'Breakfast is included and served in the _____ on the first floor.',accepted:['restaurant'],explanation:'A hotel <strong>restaurant</strong> is where meals are served to guests.'},
    // gym (4)
    {q:'The hotel has a _____ with treadmills and weights on the second floor.',accepted:['gym'],explanation:'A <strong>gym</strong> is a room with exercise equipment.'},
    {q:'I go to the hotel _____ every morning before breakfast.',accepted:['gym'],explanation:'A <strong>gym</strong> is where guests can exercise.'},
    {q:'There is no _____ in the hotel, but there is a fitness centre nearby.',accepted:['gym'],explanation:'A <strong>gym</strong> is a place for exercise — not all hotels have one.'},
    {q:'The _____ is free for all hotel guests to use.',accepted:['gym'],explanation:'A <strong>gym</strong> has equipment for exercise like treadmills and weights.'},
    // car park (6)
    {q:'If you arrive by car, you can use the hotel _____ for 50,000 soums per day.',accepted:['car park'],explanation:'A <strong>car park</strong> is an area where guests park their vehicles.'},
    {q:'The hotel _____ is underground and has space for 50 vehicles.',accepted:['car park'],explanation:'A <strong>car park</strong> is a parking area for hotel guests.'},
    {q:'Is there a _____ at the hotel? I\'m driving from Tashkent.',accepted:['car park'],explanation:'A <strong>car park</strong> is where you can park your car at the hotel.'},
    {q:'We left our car in the hotel _____ and walked to the city centre.',accepted:['car park'],explanation:'A <strong>car park</strong> is a place to park vehicles.'},
    {q:'The _____ is free for guests staying more than two nights.',accepted:['car park'],explanation:'A <strong>car park</strong> is provided by some hotels for guests with cars.'},
    {q:'There is a covered _____ at the back of the hotel.',accepted:['car park'],explanation:'A <strong>car park</strong> is where hotel guests can leave their cars.'},
  ];

  const TOTAL=9;
  let questions=[],current=0,correctCount=0,answered=false,attemptNumber=1,userId=null;

  async function getTelegramId(){if(tg?.initDataUnsafe?.user)return String(tg.initDataUnsafe.user.id);return localStorage.getItem('dev_tg_id')||'dev_user';}

  async function loadUser(){
    try{
      const tid=await getTelegramId();
      const{data}=await db.from('exam_users').select('id').eq('telegram_id',tid).single();
      userId=data?.id||null;
      if(userId){
        const{data:att}=await db.from('exam_quiz_attempts').select('id').eq('user_id',userId).eq('skill','vocabulary').eq('quiz_id',1);
        attemptNumber=(att?.length||0)+1;
      }
    }catch(e){console.error(e);}
  }

  async function saveAttempt(score){
    if(!userId)return;
    try{
      await db.from('exam_quiz_attempts').insert({user_id:userId,skill:'vocabulary',quiz_id:1,score});
      const{data:prog}=await db.from('exam_progress').select('id,tasks_done').eq('user_id',userId).eq('skill','vocabulary').single();
      if(prog){await db.from('exam_progress').update({tasks_done:Math.max(prog.tasks_done,1),updated_at:new Date().toISOString()}).eq('id',prog.id);}
      else{await db.from('exam_progress').insert({user_id:userId,skill:'vocabulary',tasks_done:1,tasks_total:8});}
    }catch(e){console.error(e);}
  }

  function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function normalize(str){return str.trim().toLowerCase().replace(/['']/g,"'").replace(/\s+/g,' ');}
  function isCorrect(input,accepted){return accepted.some(a=>normalize(a)===normalize(input));}

  function startQuiz(){
    questions=shuffle(ALL_QUESTIONS).slice(0,TOTAL);
    current=0;correctCount=0;answered=false;
    document.getElementById('quizScreen').style.display='flex';
    document.getElementById('resultScreen').classList.remove('show');
    renderQuestion();
  }

  function renderQuestion(){
    answered=false;
    const q=questions[current];
    const pct=(current/TOTAL)*100;
    document.getElementById('progressFill').style.width=pct+'%';
    document.getElementById('progressLabel').textContent=current+' / '+TOTAL;
    document.getElementById('passage').textContent=q.q;
    const input=document.getElementById('answerInput');
    input.value='';input.className='answer-input';input.readOnly=false;
    document.getElementById('feedbackBox').className='feedback-box';
    document.getElementById('checkBtn').style.display='flex';
    document.getElementById('checkBtn').disabled=true;
    document.getElementById('nextBtn').classList.remove('show');
    document.getElementById('quizScroll').scrollTo({top:0,behavior:'smooth'});
    setTimeout(()=>input.focus(),300);
  }

  document.getElementById('answerInput').addEventListener('input',function(){
    document.getElementById('checkBtn').disabled=this.value.trim().length===0;
  });
  document.getElementById('answerInput').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!document.getElementById('checkBtn').disabled&&!answered)checkAnswer();
  });

  function checkAnswer(){
    if(answered)return;
    answered=true;
    const input=document.getElementById('answerInput');
    const q=questions[current];
    const correct=isCorrect(input.value,q.accepted);
    if(correct)correctCount++;
    input.className='answer-input '+(correct?'correct':'wrong');
    input.readOnly=true;
    const fb=document.getElementById('feedbackBox');
    fb.className='feedback-box show '+(correct?'correct-fb':'wrong-fb');
    document.getElementById('fbIcon').textContent=correct?'✅':'❌';
    document.getElementById('fbText').innerHTML=correct
      ?q.explanation
      :'The correct answer is <strong>'+q.accepted[0]+'</strong>.<br><br>'+q.explanation;
    document.getElementById('checkBtn').style.display='none';
    const nb=document.getElementById('nextBtn');
    nb.classList.add('show');
    nb.innerHTML=current<TOTAL-1?'Next question <i class="ti ti-arrow-right"></i>':'See results <i class="ti ti-trophy"></i>';
    setTimeout(()=>{document.getElementById('quizScroll').scrollTo({top:999,behavior:'smooth'});},150);
  }

  function nextQuestion(){current++;if(current>=TOTAL)showResult();else renderQuestion();}

  async function showResult(){
    const score=Math.round((correctCount/TOTAL)*100);
    await saveAttempt(score);
    document.getElementById('resultEmoji').textContent=score>=80?'🎉':score>=60?'👍':'💪';
    document.getElementById('resultSub').textContent='Hotel Facilities · Attempt '+attemptNumber;
    document.getElementById('scoreNum').textContent=score+'%';
    document.getElementById('resCorrect').textContent=correctCount;
    document.getElementById('resWrong').textContent=TOTAL-correctCount;
    document.getElementById('resAttempts').textContent=attemptNumber;
    document.getElementById('quizScreen').style.display='none';
    document.getElementById('resultScreen').classList.add('show');
  }

  function retryQuiz(){attemptNumber++;startQuiz();}
  async function init(){await loadUser();startQuiz();}
  init();

  // ── CLASSROOM MODE ────────────────────────────────────────────
  (function(){
    const params=new URLSearchParams(window.location.search);
    const _session=params.get('session');
    const _classroom=params.get('classroom')==='true';
    if(!_classroom||!_session)return;
