<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vocabulary — ExamPrep</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    :root{--purple-dark:#26215C;--purple-main:#534AB7;--purple-light:#CECBF6;--purple-pale:#EEEDFE;--teal-main:#0F6E56;--teal-pale:#E1F5EE;--coral-main:#993C1D;--coral-pale:#FAECE7;--green-main:#3B6D11;--green-pale:#EAF3DE;--green-light:#C0DD97;--bg:#F0EEF8;--radius:14px;--radius-sm:10px;}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);}
    .page{height:100%;display:flex;flex-direction:column;}
    .header{background:var(--green-main);padding:10px 18px 20px;flex-shrink:0;}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .back-btn{display:flex;align-items:center;gap:5px;color:var(--green-light);font-size:13px;text-decoration:none;}
    .back-btn i{font-size:16px;}
    .home-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);color:#fff;font-size:12px;font-weight:500;padding:6px 13px;border-radius:20px;text-decoration:none;}
    .home-btn i{font-size:14px;}
    .header-title{font-size:20px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;}
    .header-title i{font-size:22px;color:var(--green-light);}
    .header-sub{font-size:12px;color:var(--green-light);margin-top:4px;}
    .stats-strip{display:flex;gap:10px;margin-top:14px;}
    .stat-pill{background:rgba(255,255,255,0.15);border-radius:20px;padding:5px 13px;display:flex;align-items:center;gap:5px;font-size:12px;color:#fff;}
    .stat-pill i{font-size:14px;color:var(--green-light);}
    .scroll{flex:1;overflow-y:auto;padding:20px 16px 30px;-webkit-overflow-scrolling:touch;}
    .scroll::-webkit-scrollbar{width:0;}
    .section-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;}
    .quiz-card{background:#fff;border-radius:var(--radius);border:0.5px solid #E0DEFA;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;text-decoration:none;transition:all 0.15s;}
    .quiz-card:active{transform:scale(0.98);}
    .quiz-icon{width:44px;height:44px;border-radius:12px;background:var(--green-pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .quiz-icon i{font-size:22px;color:var(--green-main);}
    .quiz-info{flex:1;min-width:0;}
    .quiz-name{font-size:14px;font-weight:600;color:var(--purple-dark);margin-bottom:3px;}
    .quiz-sub{font-size:12px;color:#888;}
    .quiz-meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap;}
    .meta-tag{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;}
    .meta-attempts{background:var(--purple-pale);color:var(--purple-main);}
    .meta-score{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;}
    .score-high{background:var(--teal-pale);color:var(--teal-main);}
    .score-mid{background:#FAEEDA;color:#633806;}
    .score-low{background:var(--coral-pale);color:var(--coral-main);}
    .quiz-arrow{color:#ccc;flex-shrink:0;}
    .quiz-arrow i{font-size:18px;}
    @keyframes shimmer{0%{opacity:0.5;}50%{opacity:1;}100%{opacity:0.5;}}
    .loading-card{background:#fff;border-radius:var(--radius);border:0.5px solid #E0DEFA;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;animation:shimmer 1.2s infinite;}
    .loading-line{height:12px;background:#f0f0f0;border-radius:6px;}
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-top">
      <a class="back-btn" href="../index.html"><i class="ti ti-arrow-left"></i> Home</a>
      <a class="home-btn" href="../index.html"><i class="ti ti-home"></i> Main menu</a>
    </div>
    <div class="header-title"><i class="ti ti-cards"></i> Vocabulary</div>
    <div class="header-sub">Practice words and phrases from your textbook</div>
    <div class="stats-strip">
      <div class="stat-pill"><i class="ti ti-clipboard-check"></i> <span id="statDone">—</span> completed</div>
      <div class="stat-pill"><i class="ti ti-chart-bar"></i> Avg <span id="statAvg">—</span></div>
    </div>
  </div>
  <div class="scroll">
    <div class="section-label">All quizzes</div>
    <div id="quizList">
      <div class="loading-card"><div class="quiz-icon"></div><div style="flex:1;"><div class="loading-line" style="width:60%;margin-bottom:8px;"></div><div class="loading-line" style="width:40%;"></div></div></div>
      <div class="loading-card"><div class="quiz-icon"></div><div style="flex:1;"><div class="loading-line" style="width:70%;margin-bottom:8px;"></div><div class="loading-line" style="width:45%;"></div></div></div>
    </div>
  </div>
</div>
<script>
  const SUPABASE_URL='https://wfpphviaosfedotbivtb.supabase.co';
  const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHBodmlhb3NmZWRvdGJpdnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjI0MzgsImV4cCI6MjA5NTYzODQzOH0.HyY11YK2hjmRogCGMKcB_s6EpwGM7OQbFtR7HNTLryQ';
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const tg=window.Telegram?.WebApp;
  tg?.ready();tg?.expand();

  // ── ADD NEW QUIZZES HERE AS YOU BUILD THEM ──────────────────
  const QUIZZES=[
    {id:1, name:'Hotel Facilities',  sub:'gym, lift, car park, Wi-Fi, towels, safe...', file:'./quiz1.html', icon:'ti-building'},
    {id:2, name:'Verbs in Context',  sub:'bought, used, took, told, went',              file:'./quiz2.html', icon:'ti-writing'},
  ];

  async function getTelegramId(){
    if(tg?.initDataUnsafe?.user)return String(tg.initDataUnsafe.user.id);
    return localStorage.getItem('dev_tg_id')||'dev_user';
  }

  async function init(){
    try{
      const tid=await getTelegramId();
      const{data:user}=await db.from('exam_users').select('id').eq('telegram_id',tid).single();
      if(!user){renderQuizzes({});return;}
      const{data:attempts}=await db.from('exam_quiz_attempts').select('quiz_id,score').eq('user_id',user.id).eq('skill','vocabulary');
      const stats={};
      (attempts||[]).forEach(a=>{
        if(!stats[a.quiz_id])stats[a.quiz_id]={count:0,best:0};
        stats[a.quiz_id].count++;
        stats[a.quiz_id].best=Math.max(stats[a.quiz_id].best,a.score);
      });
      const completed=Object.keys(stats).length;
      const allScores=Object.values(stats).map(s=>s.best);
      const avg=allScores.length?Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length):null;
      document.getElementById('statDone').textContent=completed+' / '+QUIZZES.length;
      document.getElementById('statAvg').textContent=avg!==null?avg+'%':'—';
      renderQuizzes(stats);
    }catch(e){console.error(e);renderQuizzes({});}
  }

  function renderQuizzes(stats){
    const list=document.getElementById('quizList');
    list.innerHTML='';
    QUIZZES.forEach(q=>{
      const s=stats[q.id];
      const attempts=s?s.count:0;
      const best=s?s.best:null;
      const scoreHtml=best!==null?`<span class="meta-score ${best>=80?'score-high':best>=60?'score-mid':'score-low'}">Best: ${best}%</span>`:'';
      const attHtml=attempts>0?`<span class="meta-tag meta-attempts">${attempts} attempt${attempts>1?'s':''}</span>`:'';
      list.innerHTML+=`
        <a class="quiz-card" href="${q.file}">
          <div class="quiz-icon"><i class="ti ${q.icon||'ti-cards'}"></i></div>
          <div class="quiz-info">
            <div class="quiz-name">${q.name}</div>
            <div class="quiz-sub">${q.sub}</div>
            <div class="quiz-meta">${attHtml}${scoreHtml}</div>
          </div>
          <div class="quiz-arrow"><i class="ti ti-chevron-right"></i></div>
        </a>`;
    });
  }

  init();
</script>
</body>
</html>
