<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quiz 7 — Word Order II</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    :root{--purple-dark:#26215C;--purple-main:#534AB7;--purple-mid:#7F77DD;--purple-light:#CECBF6;--purple-pale:#EEEDFE;--teal-dark:#085041;--teal-main:#0F6E56;--teal-pale:#E1F5EE;--coral-dark:#712B13;--coral-main:#993C1D;--coral-pale:#FAECE7;--bg:#F0EEF8;--radius:14px;--radius-sm:10px;}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);}
    #quizScreen{height:100%;display:flex;flex-direction:column;}
    .header{background:var(--purple-main);padding:10px 18px 16px;flex-shrink:0;}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .back-btn{display:flex;align-items:center;gap:5px;color:var(--purple-light);font-size:13px;cursor:pointer;text-decoration:none;}
    .back-btn i{font-size:16px;}
    .home-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);color:#fff;font-size:12px;font-weight:500;padding:6px 13px;border-radius:20px;cursor:pointer;text-decoration:none;}
    .home-btn i{font-size:14px;}
    .progress-row{display:flex;align-items:center;gap:10px;}
    .progress-track{flex:1;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;overflow:hidden;}
    .progress-fill{height:100%;background:#fff;border-radius:3px;transition:width 0.4s ease;width:0%;}
    .progress-label{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;min-width:40px;text-align:right;}
    .scroll{flex:1;overflow-y:auto;padding:20px 16px 30px;-webkit-overflow-scrolling:touch;}
    .scroll::-webkit-scrollbar{width:0;}
    .qtopic{font-size:11px;font-weight:600;color:var(--purple-main);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;}
    .qlabel{font-size:13px;color:#888;margin-bottom:12px;font-style:italic;line-height:1.5;}
    /* WORD CHIPS */
    .word-bank{background:#fff;border-radius:var(--radius-sm);padding:14px;border:0.5px solid var(--purple-light);margin-bottom:16px;}
    .word-bank-label{font-size:10px;font-weight:600;color:var(--purple-main);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;}
    .chips{display:flex;flex-wrap:wrap;gap:7px;}
    .chip{background:var(--purple-pale);color:var(--purple-dark);font-size:14px;font-weight:500;padding:6px 12px;border-radius:20px;border:1.5px solid var(--purple-light);cursor:pointer;transition:all 0.15s;user-select:none;}
    .chip:active{transform:scale(0.95);}
    .chip.used{background:#f0f0f0;color:#bbb;border-color:#e0e0e0;cursor:default;}
    /* ANSWER BUILD AREA */
    .answer-area{background:#fff;border:2px solid var(--purple-light);border-radius:var(--radius);padding:14px;min-height:54px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px;cursor:text;transition:border-color 0.2s;}
    .answer-area:focus-within{border-color:var(--purple-main);}
    .answer-area.correct{border-color:var(--teal-main);background:var(--teal-pale);}
    .answer-area.wrong{border-color:var(--coral-main);background:var(--coral-pale);}
    .answer-area.empty-hint{border-style:dashed;}
    .placed-chip{background:var(--purple-main);color:#fff;font-size:14px;font-weight:500;padding:6px 12px;border-radius:20px;cursor:pointer;transition:all 0.15s;}
    .placed-chip:active{transform:scale(0.95);}
    .answer-area.correct .placed-chip{background:var(--teal-main);}
    .answer-area.wrong .placed-chip{background:var(--coral-main);}
    .area-placeholder{font-size:13px;color:#bbb;font-style:italic;}
    .clear-row{display:flex;justify-content:flex-end;margin-bottom:16px;}
    .clear-btn{font-size:12px;color:#aaa;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 0;}
    .clear-btn i{font-size:14px;}
    /* FEEDBACK */
    .feedback-box{border-radius:var(--radius-sm);padding:12px 14px;display:none;align-items:flex-start;gap:9px;margin-bottom:18px;animation:fadeUp 0.25s ease both;}
    .feedback-box.show{display:flex;}
    .feedback-box.correct-fb{background:var(--teal-pale);}
    .feedback-box.wrong-fb{background:var(--coral-pale);}
    .fb-icon{font-size:17px;flex-shrink:0;}
    .fb-text{font-size:13px;line-height:1.55;}
    .feedback-box.correct-fb .fb-text{color:var(--teal-dark);}
    .feedback-box.wrong-fb .fb-text{color:var(--coral-dark);}
    .check-btn{width:100%;background:var(--purple-main);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;transition:opacity 0.2s;}
    .check-btn:disabled{opacity:0.35;cursor:not-allowed;}
    .check-btn i{font-size:17px;}
    .next-btn{width:100%;background:var(--purple-main);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600;cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px;animation:fadeUp 0.25s ease both;}
    .next-btn.show{display:flex;}
    .next-btn i{font-size:17px;}
    /* RESULT */
    #resultScreen{display:none;flex-direction:column;height:100%;}
    #resultScreen.show{display:flex;}
    .result-header{background:var(--purple-main);padding:10px 18px 16px;flex-shrink:0;}
    .result-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .result-scroll{flex:1;overflow-y:auto;padding:24px 18px 30px;display:flex;flex-direction:column;align-items:center;}
    .result-emoji{font-size:54px;text-align:center;margin-bottom:10px;}
    .result-title{font-size:21px;font-weight:700;color:var(--purple-dark);text-align:center;margin-bottom:4px;}
    .result-sub{font-size:13px;color:#999;text-align:center;margin-bottom:24px;}
    .score-circle{width:116px;height:116px;border-radius:50%;background:var(--purple-pale);border:4px solid var(--purple-main);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;}
    .score-num{font-size:32px;font-weight:700;color:var(--purple-main);line-height:1;}
    .score-lbl{font-size:11px;color:#888;margin-top:4px;}
    .result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-bottom:24px;}
    .rstat{background:#fff;border-radius:var(--radius-sm);padding:12px 10px;text-align:center;border:0.5px solid #E0DEFA;}
    .rstat-val{font-size:20px;font-weight:700;}
    .rstat-lbl{font-size:10px;color:#888;margin-top:3px;}
    .rstat.c .rstat-val{color:var(--teal-main);}
    .rstat.w .rstat-val{color:var(--coral-main);}
    .rstat.a .rstat-val{color:var(--purple-main);}
    .result-btns{display:flex;flex-direction:column;gap:9px;width:100%;}
    .btn-retry{width:100%;background:var(--purple-main);color:#fff;border:none;border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
    .btn-back{width:100%;background:#fff;color:var(--purple-main);border:1.5px solid var(--purple-light);border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
    .btn-retry i,.btn-back i{font-size:17px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

<div id="quizScreen">
  <div class="header">
    <div class="header-top">
      <a class="back-btn" href="./index.html"><i class="ti ti-arrow-left"></i> Grammar</a>
      <a class="home-btn" href="../index.html"><i class="ti ti-home"></i> Main menu</a>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">0 / 10</span>
    </div>
  </div>
  <div class="scroll" id="quizScroll">
    <div class="qtopic">Word Order II</div>
    <div class="qlabel">Tap the words in the correct order to make a sentence.</div>
    <div class="word-bank" id="wordBank">
      <div class="word-bank-label">Words</div>
      <div class="chips" id="chipsEl"></div>
    </div>
    <div class="answer-area empty-hint" id="answerArea">
      <span class="area-placeholder" id="areaPlaceholder">Tap words above to build the sentence...</span>
    </div>
    <div class="clear-row">
      <button class="clear-btn" id="clearBtn" onclick="clearAnswer()"><i class="ti ti-backspace"></i> Clear</button>
    </div>
    <div class="feedback-box" id="feedbackBox">
      <span class="fb-icon" id="fbIcon"></span>
      <div class="fb-text" id="fbText"></div>
    </div>
    <button class="check-btn" id="checkBtn" onclick="checkAnswer()" disabled><i class="ti ti-check"></i> Check answer</button>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next question <i class="ti ti-arrow-right"></i></button>
  </div>
</div>

<div id="resultScreen">
  <div class="result-header">
    <div class="result-header-top">
      <a class="back-btn" href="./index.html"><i class="ti ti-arrow-left"></i> Grammar</a>
      <a class="home-btn" href="../index.html"><i class="ti ti-home"></i> Main menu</a>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
      <span class="progress-label">10 / 10</span>
    </div>
  </div>
  <div class="result-scroll">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title">Quiz complete!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="score-circle">
      <div class="score-num" id="scoreNum"></div>
      <div class="score-lbl">Your score</div>
    </div>
    <div class="result-stats">
      <div class="rstat c"><div class="rstat-val" id="resCorrect">0</div><div class="rstat-lbl">Correct</div></div>
      <div class="rstat w"><div class="rstat-val" id="resWrong">0</div><div class="rstat-lbl">Wrong</div></div>
      <div class="rstat a"><div class="rstat-val" id="resAttempts">0</div><div class="rstat-lbl">Attempts</div></div>
    </div>
    <div class="result-btns">
      <button class="btn-retry" onclick="retryQuiz()"><i class="ti ti-refresh"></i> Try again</button>
      <button class="btn-back" onclick="window.location.href='./index.html'"><i class="ti ti-list"></i> Back to Grammar</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL='https://wfpphviaosfedotbivtb.supabase.co';
  const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHBodmlhb3NmZWRvdGJpdnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjI0MzgsImV4cCI6MjA5NTYzODQzOH0.HyY11YK2hjmRogCGMKcB_s6EpwGM7OQbFtR7HNTLryQ';
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const tg=window.Telegram?.WebApp;
  tg?.ready();tg?.expand();

  // Each question: words = scrambled word chips, accepted = array of correct sentences
  const ALL_QUESTIONS=[
    // would like + noun
    {words:["I","'d","like","a","coffee","."],           accepted:["I'd like a coffee.","I 'd like a coffee."],                explanation:"<strong>I'd like</strong> (= I would like) + noun. Contraction of <em>would</em>."},
    {words:["He","'d","like","to","have","some","water","."], accepted:["He'd like to have some water.","He 'd like to have some water."], explanation:"<strong>He'd like to</strong> + verb (infinitive without <em>to</em> is used here with <em>have</em>)."},
    {words:["She","'d","like","a","salad",",","please","."], accepted:["She'd like a salad, please.","She 'd like a salad, please."],  explanation:"<strong>She'd like</strong> + noun. <em>Please</em> at the end is polite."},
    {words:["We","'d","like","an","orange","juice","."],   accepted:["We'd like an orange juice.","We 'd like an orange juice."],       explanation:"<strong>We'd like</strong> + noun. Use <em>an</em> before a vowel sound."},
    {words:["I","'d","like","to","try","the","cake","."], accepted:["I'd like to try the cake.","I 'd like to try the cake."],         explanation:"<strong>I'd like to</strong> + verb (infinitive)."},
    {words:["She","'d","like","a","cup","of","tea","."],  accepted:["She'd like a cup of tea.","She 'd like a cup of tea."],           explanation:"<strong>She'd like</strong> + noun phrase."},
    {words:["I","'d","like","to","see","the","menu","."], accepted:["I'd like to see the menu.","I 'd like to see the menu."],         explanation:"<strong>I'd like to</strong> + verb."},
    {words:["He","'d","like","to","order","now","."],     accepted:["He'd like to order now.","He 'd like to order now."],             explanation:"<strong>He'd like to</strong> + verb."},
    {words:["They","'d","like","some","milk","with","their","coffee","."], accepted:["They'd like some milk with their coffee.","They 'd like some milk with their coffee."], explanation:"<strong>They'd like</strong> + noun phrase."},
    {words:["We","'d","like","to","visit","a","café","in","Vienna","."], accepted:["We'd like to visit a café in Vienna.","We 'd like to visit a café in Vienna."], explanation:"<strong>We'd like to</strong> + verb."},

    // Would you like ...? questions
    {words:["Would","you","like","a","doughnut","?"],     accepted:["Would you like a doughnut?"],   explanation:"<strong>Would you like</strong> + noun? — polite offer."},
    {words:["Would","you","like","to","try","the","cake","?"], accepted:["Would you like to try the cake?"], explanation:"<strong>Would you like to</strong> + verb? — polite offer."},
    {words:["Would","you","like","some","milk","with","your","coffee","?"], accepted:["Would you like some milk with your coffee?"], explanation:"<strong>Would you like</strong> + noun phrase?"},
    {words:["Would","you","like","to","order","now","?"], accepted:["Would you like to order now?"],   explanation:"<strong>Would you like to</strong> + verb?"},
    {words:["Would","you","like","a","croissant","or","a","biscuit","?"], accepted:["Would you like a croissant or a biscuit?"], explanation:"<strong>Would you like</strong> + noun? Offering a choice."},
    {words:["Would","she","like","to","see","the","menu","?"], accepted:["Would she like to see the menu?"], explanation:"<strong>Would she like to</strong> + verb?"},
    {words:["Would","they","like","some","coffee","?"],   accepted:["Would they like some coffee?"],   explanation:"<strong>Would they like</strong> + noun?"},

    // More would like sentences
    {words:["Would","you","like","to","try","the","Sachertorte","?"], accepted:["Would you like to try the Sachertorte?"], explanation:"<strong>Would you like to</strong> + verb? — polite offer."},
    {words:["I","'d","like","a","croissant","and","a","coffee","."], accepted:["I'd like a croissant and a coffee.","I 'd like a croissant and a coffee."], explanation:"<strong>I'd like</strong> + two nouns joined with <em>and</em>."},
    {words:["Would","you","like","to","order","now","?"],  accepted:["Would you like to order now?"],   explanation:"<strong>Would you like to</strong> + verb?"},
    {words:["He","'d","like","a","sandwich",",","please","."], accepted:["He'd like a sandwich, please.","He 'd like a sandwich, please."], explanation:"<strong>He'd like</strong> + noun. <em>Please</em> at the end."},
    {words:["We","'d","like","to","sit","by","the","window","."], accepted:["We'd like to sit by the window.","We 'd like to sit by the window."], explanation:"<strong>We'd like to</strong> + verb."},
    {words:["Would","she","like","a","biscuit","with","her","tea","?"], accepted:["Would she like a biscuit with her tea?"], explanation:"<strong>Would she like</strong> + noun phrase?"},
    {words:["I","'d","like","to","have","a","look","at","the","menu","."], accepted:["I'd like to have a look at the menu.","I 'd like to have a look at the menu."], explanation:"<strong>I'd like to</strong> + verb phrase."},
    {words:["Would","you","like","some","apple","juice","?"], accepted:["Would you like some apple juice?"], explanation:"<strong>Would you like some</strong> + uncountable noun?"},
  ];

  let questions=[],current=0,correctCount=0,answered=false,attemptNumber=1,userId=null;
  let placedWords=[], chipStates=[];

  async function getTelegramId(){if(tg?.initDataUnsafe?.user)return String(tg.initDataUnsafe.user.id);return localStorage.getItem('dev_tg_id')||'dev_user';}

  async function loadUser(){
    try{
      const tid=await getTelegramId();
      const{data}=await db.from('exam_users').select('id').eq('telegram_id',tid).single();
      userId=data?.id||null;
      if(userId){const{data:att}=await db.from('exam_quiz_attempts').select('id').eq('user_id',userId).eq('skill','grammar').eq('quiz_id',7);attemptNumber=(att?.length||0)+1;}
    }catch(e){console.error(e);}
  }

  async function saveAttempt(score){
    if(!userId)return;
    try{
      await db.from('exam_quiz_attempts').insert({user_id:userId,skill:'grammar',quiz_id:7,score});
      const{data:prog}=await db.from('exam_progress').select('id,tasks_done').eq('user_id',userId).eq('skill','grammar').single();
      if(prog){await db.from('exam_progress').update({tasks_done:Math.max(prog.tasks_done,7),updated_at:new Date().toISOString()}).eq('id',prog.id);}
      else{await db.from('exam_progress').insert({user_id:userId,skill:'grammar',tasks_done:1,tasks_total:8});}
    }catch(e){console.error(e);}
  }

  function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  function normalize(str){return str.trim().toLowerCase().replace(/['']/g,"'").replace(/\s+/g,' ');}

  function startQuiz(){
    questions=shuffle(ALL_QUESTIONS).slice(0,10);
    current=0;correctCount=0;answered=false;
    document.getElementById('quizScreen').style.display='flex';
    document.getElementById('resultScreen').classList.remove('show');
    renderQuestion();
  }

  function renderQuestion(){
    answered=false;
    placedWords=[];
    const q=questions[current];
    const pct=(current/10)*100;
    document.getElementById('progressFill').style.width=pct+'%';
    document.getElementById('progressLabel').textContent=current+' / 10';

    // shuffle word chips
    const shuffled=shuffle([...q.words]);
    chipStates=shuffled.map((w,i)=>({word:w,index:i,used:false}));

    renderChips();
    renderAnswerArea();

    document.getElementById('feedbackBox').className='feedback-box';
    document.getElementById('checkBtn').style.display='flex';
    document.getElementById('checkBtn').disabled=true;
    document.getElementById('nextBtn').classList.remove('show');
    document.getElementById('quizScroll').scrollTo({top:0,behavior:'smooth'});
  }

  function renderChips(){
    const container=document.getElementById('chipsEl');
    container.innerHTML='';
    chipStates.forEach((chip,i)=>{
      const div=document.createElement('div');
      div.className='chip'+(chip.used?' used':'');
      div.textContent=chip.word;
      if(!chip.used) div.addEventListener('click',()=>placeWord(i));
      container.appendChild(div);
    });
  }

  function renderAnswerArea(){
    const area=document.getElementById('answerArea');
    const placeholder=document.getElementById('areaPlaceholder');
    area.innerHTML='';
    if(placedWords.length===0){
      area.classList.add('empty-hint');
      area.appendChild(placeholder);
      placeholder.style.display='';
    } else {
      area.classList.remove('empty-hint');
      placedWords.forEach((_,pos)=>{
        const chip=document.createElement('div');
        chip.className='placed-chip';
        chip.textContent=placedWords[pos].word;
        if(!answered) chip.addEventListener('click',()=>removeWord(pos));
        area.appendChild(chip);
      });
    }
  }

  function placeWord(chipIndex){
    if(answered||chipStates[chipIndex].used)return;
    chipStates[chipIndex].used=true;
    placedWords.push(chipStates[chipIndex]);
    renderChips();
    renderAnswerArea();
    document.getElementById('checkBtn').disabled=placedWords.length===0;
  }

  function removeWord(pos){
    if(answered)return;
    const removed=placedWords.splice(pos,1)[0];
    chipStates[removed.index].used=false;
    renderChips();
    renderAnswerArea();
    document.getElementById('checkBtn').disabled=placedWords.length===0;
  }

  function clearAnswer(){
    if(answered)return;
    placedWords=[];
    chipStates.forEach(c=>c.used=false);
    renderChips();
    renderAnswerArea();
    document.getElementById('checkBtn').disabled=true;
  }

  function checkAnswer(){
    if(answered)return;
    answered=true;
    const q=questions[current];
    const built=placedWords.map(c=>c.word).join(' ');
    const correct=q.accepted.some(a=>normalize(a)===normalize(built));
    if(correct)correctCount++;

    const area=document.getElementById('answerArea');
    area.className='answer-area '+(correct?'correct':'wrong');

    const fb=document.getElementById('feedbackBox');
    fb.className='feedback-box show '+(correct?'correct-fb':'wrong-fb');
    document.getElementById('fbIcon').textContent=correct?'✅':'❌';
    document.getElementById('fbText').innerHTML=correct
      ? q.explanation
      : `The correct sentence is: <strong>${q.accepted[0]}</strong><br><br>${q.explanation}`;

    document.getElementById('checkBtn').style.display='none';
    const nextBtn=document.getElementById('nextBtn');
    nextBtn.classList.add('show');
    nextBtn.innerHTML=current<9?'Next question <i class="ti ti-arrow-right"></i>':'See results <i class="ti ti-trophy"></i>';
    setTimeout(()=>{document.getElementById('quizScroll').scrollTo({top:999,behavior:'smooth'});},150);
  }

  function nextQuestion(){
    current++;
    if(current>=10)showResult();
    else renderQuestion();
  }

  async function showResult(){
    const score=Math.round((correctCount/10)*100);
    await saveAttempt(score);
    document.getElementById('resultEmoji').textContent=score>=80?'🎉':score>=60?'👍':'💪';
    document.getElementById('resultSub').textContent=`Word Order II · Attempt ${attemptNumber}`;
    document.getElementById('scoreNum').textContent=score+'%';
    document.getElementById('resCorrect').textContent=correctCount;
    document.getElementById('resWrong').textContent=10-correctCount;
    document.getElementById('resAttempts').textContent=attemptNumber;
    document.getElementById('quizScreen').style.display='none';
    document.getElementById('resultScreen').classList.add('show');
  }

  function retryQuiz(){attemptNumber++;startQuiz();}
