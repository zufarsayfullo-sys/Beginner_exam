<!DOCTYPE html>
<html lang="en">

  <style>
    :root {

      --coral-dark:#712B13;--coral-main:#993C1D;--coral-pale:#FAECE7;
      --bg:#F0EEF8;--radius:14px;--radius-sm:10px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);}
    #app{height:100%;display:flex;flex-direction:column;}
    .header{background:var(--purple-main);padding:10px 18px 16px;flex-shrink:0;}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .back-btn{display:flex;align-items:center;gap:5px;color:var(--purple-light);font-size:13px;cursor:pointer;text-decoration:none;}
    .back-btn i{font-size:16px;}
    .home-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);color:#fff;font-size:12px;font-weight:500;padding:6px 13px;border-radius:20px;cursor:pointer;text-decoration:none;}
    .home-btn i{font-size:14px;}
    .progress-row{display:flex;align-items:center;gap:10px;}
    .progress-track{flex:1;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;overflow:hidden;}
    .progress-fill{height:100%;background:#fff;border-radius:3px;transition:width 0.4s ease;width:0%;}
    .progress-label{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;min-width:40px;text-align:right;}
    .scroll{flex:1;overflow-y:auto;padding:20px 16px 30px;-webkit-overflow-scrolling:touch;}
    .scroll::-webkit-scrollbar{width:0;}
    .qtopic{font-size:11px;font-weight:600;color:var(--purple-main);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;}
    .qtext{font-size:17px;font-weight:600;color:var(--purple-dark);line-height:1.55;margin-bottom:6px;}
    .qcontext{font-size:13px;color:#999;margin-bottom:22px;font-style:italic;line-height:1.5;}
    .options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
    .opt{background:#fff;border:1.5px solid #E0DEFA;border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.15s ease;user-select:none;}
    .opt.correct{border-color:var(--teal-main);background:var(--teal-pale);pointer-events:none;}
    .opt.wrong{border-color:var(--coral-main);background:var(--coral-pale);pointer-events:none;}
    .opt.disabled{pointer-events:none;opacity:0.5;}
    .opt-circle{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--purple-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:all 0.15s ease;}
    .opt.correct .opt-circle{border-color:var(--teal-main);background:var(--teal-main);color:#fff;}
    .opt.wrong .opt-circle{border-color:var(--coral-main);background:var(--coral-main);color:#fff;}
    .opt-text{font-size:15px;font-weight:500;color:var(--purple-dark);}
    .opt.correct .opt-text{color:var(--teal-dark);}
    .opt.wrong .opt-text{color:var(--coral-dark);}
    .feedback-box{border-radius:var(--radius-sm);padding:12px 14px;display:none;align-items:flex-start;gap:9px;margin-bottom:18px;animation:fadeUp 0.25s ease both;}
    .feedback-box.show{display:flex;}
    .feedback-box.correct-fb{background:var(--teal-pale);}
    .feedback-box.wrong-fb{background:var(--coral-pale);}
    .fb-icon{font-size:17px;flex-shrink:0;}
    .fb-text{font-size:13px;line-height:1.55;}
    .feedback-box.correct-fb .fb-text{color:var(--teal-dark);}
    .feedback-box.wrong-fb .fb-text{color:var(--coral-dark);}
    .next-btn{width:100%;background:var(--purple-main);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600;cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px;animation:fadeUp 0.25s ease both;}
    .next-btn.show{display:flex;}
    .next-btn i{font-size:17px;}
    #resultScreen{display:none;flex-direction:column;height:100%;}
    #resultScreen.show{display:flex;}
    .result-header{background:var(--purple-main);padding:10px 18px 16px;flex-shrink:0;}
    .result-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .result-scroll{flex:1;overflow-y:auto;padding:24px 18px 30px;display:flex;flex-direction:column;align-items:center;}
    .result-emoji{font-size:54px;text-align:center;margin-bottom:10px;}
    .result-title{font-size:21px;font-weight:700;color:var(--purple-dark);text-align:center;margin-bottom:4px;}
    .result-sub{font-size:13px;color:#999;text-align:center;margin-bottom:24px;}
    .score-circle{width:116px;height:116px;border-radius:50%;background:var(--purple-pale);border:4px solid var(--purple-main);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;}
    .score-num{font-size:32px;font-weight:700;color:var(--purple-main);line-height:1;}
    .score-lbl{font-size:11px;color:#888;margin-top:4px;}
    .result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-bottom:24px;}
    .rstat{background:#fff;border-radius:var(--radius-sm);padding:12px 10px;text-align:center;border:0.5px solid #E0DEFA;}
    .rstat-val{font-size:20px;font-weight:700;}
    .rstat-lbl{font-size:10px;color:#888;margin-top:3px;}
    .rstat.c .rstat-val{color:var(--teal-main);}
    .rstat.w .rstat-val{color:var(--coral-main);}
    .rstat.a .rstat-val{color:var(--purple-main);}
    .result-btns{display:flex;flex-direction:column;gap:9px;width:100%;}
    .btn-retry{width:100%;background:var(--purple-main);color:#fff;border:none;border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
    .btn-back{width:100%;background:#fff;color:var(--purple-main);border:1.5px solid var(--purple-light);border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
    .btn-retry i,.btn-back i{font-size:17px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

<div id="quizScreen" style="height:100%;display:flex;flex-direction:column;">
  <div class="header">
    <div class="header-top">
      <a class="back-btn" href="./index.html"><i class="ti ti-arrow-left"></i> Grammar</a>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next question <i class="ti ti-arrow-right"></i></button>
  </div>
</div>

<div id="resultScreen">
  <div class="result-header">
    <div class="result-header-top">
      <a class="back-btn" href="./index.html"><i class="ti ti-arrow-left"></i> Grammar</a>
      <a class="home-btn" href="../index.html"><i class="ti ti-home"></i> Main menu</a>
    </div>

    <div class="result-emoji" id="resultEmoji">🎉</div>

    <div class="result-sub" id="resultSub"></div>
    <div class="score-circle">
      <div class="score-num" id="scoreNum"></div>
      <div class="score-lbl">Your score</div>
    </div>
    <div class="result-stats">
      <div class="rstat c"><div class="rstat-val" id="resCorrect">0</div><div class="rstat-lbl">Correct</div></div>
      <div class="rstat w"><div class="rstat-val" id="resWrong">0</div><div class="rstat-lbl">Wrong</div></div>
      <div class="rstat a"><div class="rstat-val" id="resAttempts">0</div><div class="rstat-lbl">Attempts</div></div>
    </div>
    <div class="result-btns">
      <button class="btn-retry" onclick="retryQuiz()"><i class="ti ti-refresh"></i> Try again</button>
      <button class="btn-back" onclick="window.location.href='./index.html'"><i class="ti ti-list"></i> Back to Grammar</button>
    </div>
  </div>
</div>

<script>

    // ── can (positive ability) ────────────────────────────────────
    { q: 'Koko is an amazing gorilla. She _____ understand language.', correct: 'can', options: ['can','can\'t','is','isn\'t'], context: 'Koko has the ability to understand language.', explanation: 'We use <strong>can</strong> to talk about ability. Koko <strong>can</strong> understand language.' },

    { q: 'She _____ type fast — she\'s very good with computers.', correct: 'can', options: ['can','can\'t','does','isn\'t'], context: 'She is skilled at typing.', explanation: '<strong>Can</strong> describes the ability to type fast.' },
    { q: 'I started swimming lessons last year. Now I _____ swim well.', correct: 'can', options: ['can','can\'t','am','was'], context: 'After lessons, the ability is achieved.', explanation: 'The person now has the ability → <strong>can</strong>.' },

    // ── can't (negative ability) ──────────────────────────────────
    { q: 'Koko is a gorilla — she _____ speak, but she can use signs.', correct: 'can\'t', options: ['can\'t','can','doesn\'t','isn\'t'], context: 'Koko communicates with signs, not words.', explanation: 'No ability to speak → <strong>can\'t</strong>.' },

    { q: 'He _____ speak Japanese well — he only knows a few words.', correct: 'can\'t', options: ['can\'t','can','doesn\'t','isn\'t'], context: 'He knows very little Japanese.', explanation: 'Limited ability = <strong>can\'t</strong> speak well.' },
    { q: 'I started learning English last month. I _____ speak it much yet.', correct: 'can\'t', options: ['can\'t','can','don\'t','am not'], context: 'Only one month of study — still learning.', explanation: 'Not enough ability yet → <strong>can\'t</strong>.' },
    { q: 'She _____ cook at all — everything she makes tastes terrible!', correct: 'can\'t', options: ['can\'t','can','doesn\'t','isn\'t'], context: 'She has no cooking ability.', explanation: 'No ability → <strong>can\'t</strong> cook.' },
    { q: 'I have a good camera, but I _____ use it well.', correct: 'can\'t', options: ['can\'t','can','don\'t','am not'], context: 'Owning a camera ≠ knowing how to use it.', explanation: 'Inability → <strong>can\'t</strong>. Having a camera doesn\'t mean ability.' },
    { q: 'Sascha the cat _____ play football — she doesn\'t understand the rules!', correct: 'can\'t', options: ['can\'t','can','doesn\'t','isn\'t'], context: 'Sascha lacks both ability and understanding.', explanation: 'No ability → <strong>can\'t</strong>.' },
    { q: 'No, I _____. But I\'m a fast learner and I\'ll try!', correct: 'can\'t', options: ['can\'t','can','don\'t','am not'], context: 'Responding negatively to "Can you drive?"', explanation: 'Negative short answer to <em>Can you…?</em> → <strong>I can\'t</strong>.' },
    { q: 'He _____ drive a car, but he can ride a motorbike.', correct: 'can\'t', options: ['can\'t','can','doesn\'t','isn\'t'], context: 'He has one ability but not the other.', explanation: 'No driving ability → <strong>can\'t</strong> drive, but <strong>can</strong> ride a motorbike.' },

    // ── can (questions) ───────────────────────────────────────────
    { q: '_____ you swim? We need good swimmers for the project.', correct: 'Can', options: ['Can','Can\'t','Do','Are'], context: 'Interviewer asking about ability for a job.', explanation: 'Questions about ability use <strong>Can</strong> + subject + verb.' },
    { q: '_____ Koko paint pictures?', correct: 'Can', options: ['Can','Can\'t','Does','Is'], context: 'Asking about Koko\'s artistic ability.', explanation: 'Ability question → <strong>Can</strong> + subject + verb.' },

    { q: 'A: Can you swim? B: Yes, I _____ . I swim every day.', correct: 'can', options: ['can','can\'t','do','am'], context: 'Positive short answer.', explanation: 'Positive short answer to <em>Can you…?</em> → <strong>Yes, I can</strong>.' },
    { q: 'A: Can you drive? B: No, I _____ . I don\'t have a licence.', correct: 'can\'t', options: ['can\'t','can','don\'t','am not'], context: 'Negative short answer.', explanation: 'Negative short answer → <strong>No, I can\'t</strong>.' },
    { q: 'A: Can Koko speak? B: No, she _____ , but she uses signs.', correct: 'can\'t', options: ['can\'t','can','doesn\'t','isn\'t'], context: 'Koko cannot speak — she uses signs instead.', explanation: 'Negative short answer → <strong>No, she can\'t</strong>.' },
    { q: 'A: Can you use a camera? B: Yes, I _____ . I love photography.', correct: 'can', options: ['can','can\'t','do','am'], context: 'Positive short answer showing ability.', explanation: '<strong>Yes, I can</strong> — positive short answer to <em>Can you…?</em>' },
    { q: 'A: Can she understand English? B: Yes, she _____ — she studied for years.', correct: 'can', options: ['can','can\'t','does','is'], context: 'Years of study = good ability.', explanation: 'Positive short answer → <strong>Yes, she can</strong>.' },

    // ── can / can't (sentence completion — context clues) ─────────
    { q: 'She _____ paint pictures. We watched her in a video.', correct: 'can', options: ['can','can\'t','does','is'], context: 'We saw evidence of her painting ability.', explanation: 'Witnessed ability → <strong>can</strong>.' },
    { q: 'He reads very slowly. He _____ read fast at all.', correct: 'can\'t', options: ['can\'t','can','doesn\'t','isn\'t'], context: 'Slow reading = not able to read fast.', explanation: 'Inability → <strong>can\'t</strong> read fast.' },
    { q: 'She _____ cook badly — her food is always delicious!', correct: 'can\'t', options: ['can\'t','can','doesn\'t','isn\'t'], context: 'Her food is delicious — so she definitely can\'t cook badly.', explanation: 'Delicious food → she <strong>can\'t</strong> cook badly (she cooks well!).' },

    { q: 'I _____ ride a bike — I ride it to school every day!', correct: 'can', options: ['can','can\'t','do','am'], context: 'Daily bike riding = clear ability.', explanation: 'Riding every day = ability → <strong>can</strong>.' },
    { q: 'He _____ type fast, but he can understand computer programs.', correct: 'can\'t', options: ['can\'t','can','doesn\'t','isn\'t'], context: 'Types slowly but understands programs.', explanation: 'Slow typist = <strong>can\'t</strong> type fast.' },

    // ── word order / sentence correction ─────────────────────────
    { q: 'Which sentence is correct?', correct: 'She can type fast.', options: ['She can type fast.','She type can fast.','She fast can type.','Can she type fast.'], context: 'Adverbs of manner go after the verb.', explanation: '<strong>Can</strong> + verb + adverb: <em>She can type <strong>fast</strong>.</em>' },
    { q: 'Which sentence is correct?', correct: 'I can\'t speak French well.', options: ['I can\'t speak French well.','I can\'t well speak French.','Well I can\'t speak French.','I can\'t French speak well.'], context: 'Adverb of manner placement with can\'t.', explanation: '<strong>Can\'t</strong> + verb + object + adverb: <em>I can\'t speak French <strong>well</strong>.</em>' },

    { q: 'Dr Patterson is interested in Koko because she _____ understand language.', correct: 'can', options: ['can','can\'t','does','is'], context: 'This is why Koko is special and interesting.', explanation: 'The unusual ability → <strong>can</strong> understand language.' },

    { q: 'Volunteers need people who _____ teach English to tourists.', correct: 'can', options: ['can','can\'t','are','do'], context: 'The Dolphin Research Project needs English teachers.', explanation: 'Required ability → <strong>can</strong> teach English.' },

    { q: 'He _____ play football well, but he _____ understand the rules.', correct: 'can / can\'t', options: ['can / can\'t','can\'t / can','can / can','can\'t / can\'t'], context: 'He plays well but doesn\'t understand the rules.', explanation: 'Good at playing (<strong>can</strong>) but no rule knowledge (<strong>can\'t</strong>).' },

    { q: 'She _____ drive a car, but she _____ ride a motorbike.', correct: 'can / can\'t', options: ['can / can\'t','can\'t / can','can / can','can\'t / can\'t'], context: 'She drives but doesn\'t ride motorbikes.', explanation: '<strong>Can</strong> drive + <strong>can\'t</strong> ride — two different abilities.' },
  ];

  let questions = [], current = 0, correct = 0, answered = false, attemptNumber = 1, userId = null;

  async function getTelegramId() {
    if (tg?.initDataUnsafe?.user) return String(tg.initDataUnsafe.user.id);
    return localStorage.getItem('dev_tg_id') || 'dev_user';
  }

  async function loadUser() {
    try {
      const tid = await getTelegramId();
      const { data } = await db.from('exam_users').select('id').eq('telegram_id', tid).single();
      userId = data?.id || null;
      if (userId) {
        const { data: att } = await db.from('exam_quiz_attempts').select('id').eq('user_id', userId).eq('skill', 'grammar').eq('quiz_id', 2);
        attemptNumber = (att?.length || 0) + 1;
      }
    } catch(e) { console.error(e); }
  }

  async function saveAttempt(score) {
    if (!userId) return;
    try {
      await db.from('exam_quiz_attempts').insert({ user_id: userId, skill: 'grammar', quiz_id: 2, score });
      const { data: prog } = await db.from('exam_progress').select('id,tasks_done,tasks_total').eq('user_id', userId).eq('skill', 'grammar').single();
      if (prog) {
        await db.from('exam_progress').update({ tasks_done: Math.max(prog.tasks_done, 2), updated_at: new Date().toISOString() }).eq('id', prog.id);
      } else {
        await db.from('exam_progress').insert({ user_id: userId, skill: 'grammar', tasks_done: 1, tasks_total: 8 });
      }
    } catch(e) { console.error(e); }
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startQuiz() {
    questions = shuffle(ALL_QUESTIONS).slice(0, 10);
    current = 0; correct = 0; answered = false;
    document.getElementById('quizScreen').style.display = 'flex';
    document.getElementById('resultScreen').classList.remove('show');
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = questions[current];
    const pct = (current / 10) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = current + ' / 10';
    document.getElementById('qtext').textContent = q.q;
    document.getElementById('qcontext').textContent = q.context;

    const fb = document.getElementById('feedbackBox');
    fb.className = 'feedback-box';
    document.getElementById('nextBtn').classList.remove('show');

    const container = document.getElementById('optionsEl');
    container.innerHTML = '';
    shuffle(q.options).forEach(opt => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.innerHTML = `<div class="opt-circle"></div><span class="opt-text">${opt}</span>`;
      div.addEventListener('click', () => selectAnswer(opt, q));
      container.appendChild(div);
    });
    document.getElementById('quizScroll').scrollTo({ top: 0, behavior: 'smooth' });
  }

  function selectAnswer(chosen, q) {
    if (answered) return;
    answered = true;
    const isCorrect = chosen === q.correct;
    if (isCorrect) correct++;

    document.querySelectorAll('.opt').forEach(el => {
      const text = el.querySelector('.opt-text').textContent;
      if (text === q.correct) {
        el.classList.add('correct');
        el.querySelector('.opt-circle').innerHTML = '<i class="ti ti-check" style="font-size:12px;"></i>';
      } else if (text === chosen && !isCorrect) {
        el.classList.add('wrong');
        el.querySelector('.opt-circle').innerHTML = '<i class="ti ti-x" style="font-size:12px;"></i>';
      } else {
        el.classList.add('disabled');
      }
    });

    const fb = document.getElementById('feedbackBox');
    fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
    document.getElementById('fbIcon').textContent = isCorrect ? '✅' : '❌';
    document.getElementById('fbText').innerHTML = q.explanation;

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.classList.add('show');
    nextBtn.innerHTML = current < 9 ? 'Next question <i class="ti ti-arrow-right"></i>' : 'See results <i class="ti ti-trophy"></i>';
    setTimeout(() => { document.getElementById('quizScroll').scrollTo({ top: 999, behavior: 'smooth' }); }, 150);
  }

  function nextQuestion() {
    current++;
    if (current >= 10) showResult();
    else renderQuestion();
  }

  async function showResult() {
    const score = Math.round((correct / 10) * 100);
    await saveAttempt(score);
    document.getElementById('resultEmoji').textContent = score >= 80 ? '🎉' : score >= 60 ? '👍' : '💪';
    document.getElementById('resultSub').textContent = `Can / Can't · Attempt ${attemptNumber}`;
    document.getElementById('scoreNum').textContent = score + '%';
    document.getElementById('resCorrect').textContent = correct;
    document.getElementById('resWrong').textContent = 10 - correct;
    document.getElementById('resAttempts').textContent = attemptNumber;
    document.getElementById('quizScreen').style.display = 'none';
    document.getElementById('resultScreen').classList.add('show');
  }

  function retryQuiz() { attemptNumber++; startQuiz(); }

  async function init() { await loadUser(); startQuiz(); }
  init();
