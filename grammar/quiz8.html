<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quiz 8 — To Be Going To</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    :root{--purple-dark:#26215C;--purple-main:#534AB7;--purple-mid:#7F77DD;--purple-light:#CECBF6;--purple-pale:#EEEDFE;--teal-dark:#085041;--teal-main:#0F6E56;--teal-pale:#E1F5EE;--coral-dark:#712B13;--coral-main:#993C1D;--coral-pale:#FAECE7;--bg:#F0EEF8;--radius:14px;--radius-sm:10px;}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);}
    #quizScreen{height:100%;display:flex;flex-direction:column;}
    .header{background:var(--purple-main);padding:10px 18px 16px;flex-shrink:0;}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .back-btn{display:flex;align-items:center;gap:5px;color:var(--purple-light);font-size:13px;cursor:pointer;text-decoration:none;}
    .back-btn i{font-size:16px;}
    .home-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.15);color:#fff;font-size:12px;font-weight:500;padding:6px 13px;border-radius:20px;cursor:pointer;text-decoration:none;}
    .home-btn i{font-size:14px;}
    .progress-row{display:flex;align-items:center;gap:10px;}
    .progress-track{flex:1;height:6px;background:rgba(255,255,255,0.2);border-radius:3px;overflow:hidden;}
    .progress-fill{height:100%;background:#fff;border-radius:3px;transition:width 0.4s ease;width:0%;}
    .progress-label{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;min-width:40px;text-align:right;}
    .scroll{flex:1;overflow-y:auto;padding:20px 16px 30px;-webkit-overflow-scrolling:touch;}
    .scroll::-webkit-scrollbar{width:0;}
    .qtopic{font-size:11px;font-weight:600;color:var(--purple-main);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;}
    .qlabel{font-size:13px;color:#888;margin-bottom:12px;font-style:italic;line-height:1.5;}
    .qtext{font-size:17px;font-weight:600;color:var(--purple-dark);line-height:1.65;margin-bottom:16px;background:#fff;border-radius:var(--radius-sm);padding:14px 16px;border:0.5px solid var(--purple-light);}
    .input-label{font-size:11px;font-weight:600;color:var(--purple-main);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px;}
    .answer-input{width:100%;background:#fff;border:2px solid var(--purple-light);border-radius:var(--radius);padding:14px 16px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--purple-dark);outline:none;transition:border-color 0.2s;margin-bottom:16px;}
    .answer-input:focus{border-color:var(--purple-main);}
    .answer-input.correct{border-color:var(--teal-main);background:var(--teal-pale);color:var(--teal-dark);}
    .answer-input.wrong{border-color:var(--coral-main);background:var(--coral-pale);color:var(--coral-dark);}
    .feedback-box{border-radius:var(--radius-sm);padding:12px 14px;display:none;align-items:flex-start;gap:9px;margin-bottom:18px;animation:fadeUp 0.25s ease both;}
    .feedback-box.show{display:flex;}
    .feedback-box.correct-fb{background:var(--teal-pale);}
    .feedback-box.wrong-fb{background:var(--coral-pale);}
    .fb-icon{font-size:17px;flex-shrink:0;}
    .fb-text{font-size:13px;line-height:1.55;}
    .feedback-box.correct-fb .fb-text{color:var(--teal-dark);}
    .feedback-box.wrong-fb .fb-text{color:var(--coral-dark);}
    .check-btn{width:100%;background:var(--purple-main);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;transition:opacity 0.2s;}
    .check-btn:disabled{opacity:0.35;cursor:not-allowed;}
    .check-btn i{font-size:17px;}
    .next-btn{width:100%;background:var(--purple-main);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600;cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px;animation:fadeUp 0.25s ease both;}
    .next-btn.show{display:flex;}
    .next-btn i{font-size:17px;}
    #resultScreen{display:none;flex-direction:column;height:100%;}
    #resultScreen.show{display:flex;}
    .result-header{background:var(--purple-main);padding:10px 18px 16px;flex-shrink:0;}
    .result-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .result-scroll{flex:1;overflow-y:auto;padding:24px 18px 30px;display:flex;flex-direction:column;align-items:center;}
    .result-emoji{font-size:54px;text-align:center;margin-bottom:10px;}
    .result-title{font-size:21px;font-weight:700;color:var(--purple-dark);text-align:center;margin-bottom:4px;}
    .result-sub{font-size:13px;color:#999;text-align:center;margin-bottom:24px;}
    .score-circle{width:116px;height:116px;border-radius:50%;background:var(--purple-pale);border:4px solid var(--purple-main);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;}
    .score-num{font-size:32px;font-weight:700;color:var(--purple-main);line-height:1;}
    .score-lbl{font-size:11px;color:#888;margin-top:4px;}
    .result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-bottom:24px;}
    .rstat{background:#fff;border-radius:var(--radius-sm);padding:12px 10px;text-align:center;border:0.5px solid #E0DEFA;}
    .rstat-val{font-size:20px;font-weight:700;}
    .rstat-lbl{font-size:10px;color:#888;margin-top:3px;}
    .rstat.c .rstat-val{color:var(--teal-main);}
    .rstat.w .rstat-val{color:var(--coral-main);}
    .rstat.a .rstat-val{color:var(--purple-main);}
    .result-btns{display:flex;flex-direction:column;gap:9px;width:100%;}
    .btn-retry{width:100%;background:var(--purple-main);color:#fff;border:none;border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
    .btn-back{width:100%;background:#fff;color:var(--purple-main);border:1.5px solid var(--purple-light);border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
    .btn-retry i,.btn-back i{font-size:17px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
<div id="quizScreen">
  <div class="header">
    <div class="header-top">
      <a class="back-btn" href="./index.html"><i class="ti ti-arrow-left"></i> Grammar</a>
      <a class="home-btn" href="../index.html"><i class="ti ti-home"></i> Main menu</a>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">0 / 10</span>
    </div>
  </div>
  <div class="scroll" id="quizScroll">
    <div class="qtopic">To Be Going To</div>
    <div class="qlabel">Write the missing word(s) — <em>am / is / are / isn't / aren't</em> — to complete the sentence.</div>
    <div class="qtext" id="qtext"></div>
    <div class="input-label">Your answer</div>
    <input class="answer-input" id="answerInput" type="text" placeholder="Type here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <div class="feedback-box" id="feedbackBox">
      <span class="fb-icon" id="fbIcon"></span>
      <div class="fb-text" id="fbText"></div>
    </div>
    <button class="check-btn" id="checkBtn" onclick="checkAnswer()" disabled><i class="ti ti-check"></i> Check answer</button>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next question <i class="ti ti-arrow-right"></i></button>
  </div>
</div>
<div id="resultScreen">
  <div class="result-header">
    <div class="result-header-top">
      <a class="back-btn" href="./index.html"><i class="ti ti-arrow-left"></i> Grammar</a>
      <a class="home-btn" href="../index.html"><i class="ti ti-home"></i> Main menu</a>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
      <span class="progress-label">10 / 10</span>
    </div>
  </div>
  <div class="result-scroll">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title">Quiz complete!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="score-circle">
      <div class="score-num" id="scoreNum"></div>
      <div class="score-lbl">Your score</div>
    </div>
    <div class="result-stats">
      <div class="rstat c"><div class="rstat-val" id="resCorrect">0</div><div class="rstat-lbl">Correct</div></div>
      <div class="rstat w"><div class="rstat-val" id="resWrong">0</div><div class="rstat-lbl">Wrong</div></div>
      <div class="rstat a"><div class="rstat-val" id="resAttempts">0</div><div class="rstat-lbl">Attempts</div></div>
    </div>
    <div class="result-btns">
      <button class="btn-retry" onclick="retryQuiz()"><i class="ti ti-refresh"></i> Try again</button>
      <button class="btn-back" onclick="window.location.href='./index.html'"><i class="ti ti-list"></i> Back to Grammar</button>
    </div>
  </div>
</div>
<script>
  const SUPABASE_URL='https://wfpphviaosfedotbivtb.supabase.co';
  const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHBodmlhb3NmZWRvdGJpdnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjI0MzgsImV4cCI6MjA5NTYzODQzOH0.HyY11YK2hjmRogCGMKcB_s6EpwGM7OQbFtR7HNTLryQ';
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const tg=window.Telegram?.WebApp;
  tg?.ready();tg?.expand();
  const ALL_QUESTIONS=[
    // am going to
    {q:"I _____ going to be a volunteer in Guatemala next summer.",accepted:["am"],explanation:"Subject <em>I</em> → <strong>am</strong> going to + verb."},
    {q:"I _____ going to travel to the Arctic next month.",accepted:["am"],explanation:"Subject <em>I</em> → <strong>am</strong> going to + verb."},
    {q:"I _____ going to learn a new language next year.",accepted:["am"],explanation:"Subject <em>I</em> → <strong>am</strong> going to + verb."},
    {q:"I _____ going to move abroad after I finish school.",accepted:["am"],explanation:"Subject <em>I</em> → <strong>am</strong> going to + verb."},
    {q:"I _____ going to study international relations at university.",accepted:["am"],explanation:"Subject <em>I</em> → <strong>am</strong> going to + verb."},
    // is going to
    {q:"She _____ going to travel around Europe next year.",accepted:["is"],explanation:"Subject <em>she</em> → <strong>is</strong> going to + verb."},
    {q:"He _____ going to change jobs next month.",accepted:["is"],explanation:"Subject <em>he</em> → <strong>is</strong> going to + verb."},
    {q:"Roxanne _____ going to sing in five different countries.",accepted:["is"],explanation:"<em>Roxanne</em> = she → <strong>is</strong> going to + verb."},
    {q:"The café _____ going to open to the public in eight months.",accepted:["is"],explanation:"<em>The café</em> = it → <strong>is</strong> going to + verb."},
    {q:"Tom _____ going to teach English in the Maldives.",accepted:["is"],explanation:"<em>Tom</em> = he → <strong>is</strong> going to + verb."},
    {q:"She _____ going to have a baby next spring.",accepted:["is"],explanation:"Subject <em>she</em> → <strong>is</strong> going to + verb."},
    {q:"Oliver _____ going to email the hotel information next week.",accepted:["is"],explanation:"<em>Oliver</em> = he → <strong>is</strong> going to + verb."},
    // are going to
    {q:"They _____ going to visit five cities in five different countries.",accepted:["are"],explanation:"Subject <em>they</em> → <strong>are</strong> going to + verb."},
    {q:"We _____ going to write a blog about our trip.",accepted:["are"],explanation:"Subject <em>we</em> → <strong>are</strong> going to + verb."},
    {q:"They _____ going to study the environment in Alaska.",accepted:["are"],explanation:"Subject <em>they</em> → <strong>are</strong> going to + verb."},
    {q:"You _____ going to live in the Maldives for a long time.",accepted:["are"],explanation:"Subject <em>you</em> → <strong>are</strong> going to + verb."},
    {q:"We _____ going to build a new front for the café.",accepted:["are"],explanation:"Subject <em>we</em> → <strong>are</strong> going to + verb."},
    {q:"My friend and I _____ going to join a group of scientists.",accepted:["are"],explanation:"<em>My friend and I</em> = we → <strong>are</strong> going to + verb."},
    {q:"Rebecca and her friends _____ going to visit different countries.",accepted:["are"],explanation:"<em>Rebecca and her friends</em> = they → <strong>are</strong> going to + verb."},
    // isn't going to (negative)
    {q:"She _____ going to take photos — she forgot her camera.",accepted:["isn't","is not"],explanation:"<em>She</em> negative → <strong>isn't</strong> going to + verb."},
    {q:"He _____ going to bring mobile phones or computers.",accepted:["isn't","is not"],explanation:"<em>He</em> negative → <strong>isn't</strong> going to + verb."},
    {q:"She _____ going to treat the trip as a holiday.",accepted:["isn't","is not"],explanation:"<em>She</em> negative → <strong>isn't</strong> going to + verb."},
    {q:"Tom _____ going to work as an engineer any more.",accepted:["isn't","is not"],explanation:"<em>Tom</em> = he, negative → <strong>isn't</strong> going to + verb."},
    {q:"The project _____ going to cost very much — it's free!",accepted:["isn't","is not"],explanation:"<em>The project</em> = it, negative → <strong>isn't</strong> going to + verb."},
    // aren't going to (negative)
    {q:"We _____ going to spend the money on hotels or food.",accepted:["aren't","are not"],explanation:"<em>We</em> negative → <strong>aren't</strong> going to + verb."},
    {q:"They _____ going to stay in a hotel — they have a flat.",accepted:["aren't","are not"],explanation:"<em>They</em> negative → <strong>aren't</strong> going to + verb."},
    {q:"We _____ going to be there for more than three weeks.",accepted:["aren't","are not"],explanation:"<em>We</em> negative → <strong>aren't</strong> going to + verb."},
    {q:"You _____ going to visit your parents this weekend.",accepted:["aren't","are not"],explanation:"<em>You</em> negative → <strong>aren't</strong> going to + verb."},
    // questions — Is / Are
    {q:"_____ she going to travel to Europe?",accepted:["Is"],explanation:"<em>She</em> question → <strong>Is</strong> she going to + verb?"},
    {q:"_____ you going to go with her to the Maldives?",accepted:["Are"],explanation:"<em>You</em> question → <strong>Are</strong> you going to + verb?"},
    {q:"_____ Tom going to change jobs?",accepted:["Is"],explanation:"<em>Tom</em> = he → <strong>Is</strong> Tom going to + verb?"},
    {q:"_____ they going to visit five cities?",accepted:["Are"],explanation:"<em>They</em> question → <strong>Are</strong> they going to + verb?"},
    {q:"_____ you going to cook dinner tonight?",accepted:["Are"],explanation:"<em>You</em> question → <strong>Are</strong> you going to + verb?"},
    {q:"_____ Shaun going to walk 150 kilometres?",accepted:["Is"],explanation:"<em>Shaun</em> = he → <strong>Is</strong> Shaun going to + verb?"},
    {q:"_____ the group going to write a blog?",accepted:["Is"],explanation:"<em>The group</em> = it/they, singular → <strong>Is</strong> the group going to + verb?"},
    // wh- questions
    {q:"Where _____ you going to live in the Maldives?",accepted:["are"],explanation:"Wh- question, <em>you</em> → <strong>are</strong> you going to + verb?"},
    {q:"What _____ you going to do when you arrive?",accepted:["are"],explanation:"Wh- question, <em>you</em> → <strong>are</strong> you going to + verb?"},
    {q:"When _____ he going to call back?",accepted:["is"],explanation:"Wh- question, <em>he</em> → <strong>is</strong> he going to + verb?"},
    {q:"Who _____ you going to see in Europe?",accepted:["are"],explanation:"Wh- question, <em>you</em> → <strong>are</strong> you going to + verb?"},
    {q:"How long _____ they going to stay in Alaska?",accepted:["are"],explanation:"Wh- question, <em>they</em> → <strong>are</strong> they going to + verb?"},
    // short answers
    {q:"A: Are you going to live in a hotel? B: No, we _____ .",accepted:["aren't","are not"],explanation:"Negative short answer → <strong>No, we aren't</strong>."},
    {q:"A: Is Tom going to change jobs? B: Yes, he _____ .",accepted:["is"],explanation:"Positive short answer → <strong>Yes, he is</strong>."},
    {q:"A: Are you going to go with her? B: Yes, I _____ .",accepted:["am"],explanation:"Positive short answer with <em>I</em> → <strong>Yes, I am</strong>."},
    {q:"A: Is she going to be a doctor? B: No, she _____ .",accepted:["isn't","is not"],explanation:"Negative short answer → <strong>No, she isn't</strong>."},
    {q:"A: Are they going to buy a house? B: No, they _____ .",accepted:["aren't","are not"],explanation:"Negative short answer → <strong>No, they aren't</strong>."},
    {q:"A: Is Roxanne going to sing in Europe? B: Yes, she _____ .",accepted:["is"],explanation:"Positive short answer → <strong>Yes, she is</strong>."},
    {q:"A: Are you going to raise the money? B: Yes, we _____ .",accepted:["are"],explanation:"Positive short answer → <strong>Yes, we are</strong>."},
  ];
  let questions=[],current=0,correctCount=0,answered=false,attemptNumber=1,userId=null;
  async function getTelegramId(){if(tg?.initDataUnsafe?.user)return String(tg.initDataUnsafe.user.id);return localStorage.getItem('dev_tg_id')||'dev_user';}
  async function loadUser(){try{const tid=await getTelegramId();const{data}=await db.from('exam_users').select('id').eq('telegram_id',tid).single();userId=data?.id||null;if(userId){const{data:att}=await db.from('exam_quiz_attempts').select('id').eq('user_id',userId).eq('skill','grammar').eq('quiz_id',8);attemptNumber=(att?.length||0)+1;}}catch(e){console.error(e);}}
  async function saveAttempt(score){if(!userId)return;try{await db.from('exam_quiz_attempts').insert({user_id:userId,skill:'grammar',quiz_id:8,score});const{data:prog}=await db.from('exam_progress').select('id,tasks_done').eq('user_id',userId).eq('skill','grammar').single();if(prog){await db.from('exam_progress').update({tasks_done:Math.max(prog.tasks_done,8),updated_at:new Date().toISOString()}).eq('id',prog.id);}else{await db.from('exam_progress').insert({user_id:userId,skill:'grammar',tasks_done:1,tasks_total:8});}}catch(e){console.error(e);}}
  function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function normalize(str){return str.trim().toLowerCase().replace(/['']/g,"'").replace(/\s+/g,' ').replace(/\.$/,'');}
  function isCorrect(input,accepted){const norm=normalize(input);return accepted.some(a=>normalize(a)===norm);}
  function startQuiz(){questions=shuffle(ALL_QUESTIONS).slice(0,10);current=0;correctCount=0;answered=false;document.getElementById('quizScreen').style.display='flex';document.getElementById('resultScreen').classList.remove('show');renderQuestion();}
  function renderQuestion(){answered=false;const q=questions[current];const pct=(current/10)*100;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressLabel').textContent=current+' / 10';document.getElementById('qtext').textContent=q.q;const input=document.getElementById('answerInput');input.value='';input.className='answer-input';input.readOnly=false;document.getElementById('feedbackBox').className='feedback-box';document.getElementById('checkBtn').style.display='flex';document.getElementById('checkBtn').disabled=true;document.getElementById('nextBtn').classList.remove('show');document.getElementById('quizScroll').scrollTo({top:0,behavior:'smooth'});setTimeout(()=>input.focus(),300);}
  document.getElementById('answerInput').addEventListener('input',function(){document.getElementById('checkBtn').disabled=this.value.trim().length===0;});
  document.getElementById('answerInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!document.getElementById('checkBtn').disabled&&!answered)checkAnswer();});
  function checkAnswer(){if(answered)return;answered=true;const input=document.getElementById('answerInput');const q=questions[current];const correct=isCorrect(input.value,q.accepted);if(correct)correctCount++;input.className='answer-input '+(correct?'correct':'wrong');input.readOnly=true;const fb=document.getElementById('feedbackBox');fb.className='feedback-box show '+(correct?'correct-fb':'wrong-fb');document.getElementById('fbIcon').textContent=correct?'✅':'❌';document.getElementById('fbText').innerHTML=correct?q.explanation:`The correct answer is <strong>${q.accepted[0]}</strong>.<br><br>${q.explanation}`;document.getElementById('checkBtn').style.display='none';const nextBtn=document.getElementById('nextBtn');nextBtn.classList.add('show');nextBtn.innerHTML=current<9?'Next question <i class="ti ti-arrow-right"></i>':'See results <i class="ti ti-trophy"></i>';setTimeout(()=>{document.getElementById('quizScroll').scrollTo({top:999,behavior:'smooth'});},150);}
  function nextQuestion(){current++;if(current>=10)showResult();else renderQuestion();}
  async function showResult(){const score=Math.round((correctCount/10)*100);await saveAttempt(score);document.getElementById('resultEmoji').textContent=score>=80?'🎉':score>=60?'👍':'💪';document.getElementById('resultSub').textContent=`To Be Going To · Attempt ${attemptNumber}`;document.getElementById('scoreNum').textContent=score+'%';document.getElementById('resCorrect').textContent=correctCount;document.getElementById('resWrong').textContent=10-correctCount;document.getElementById('resAttempts').textContent=attemptNumber;document.getElementById('quizScreen').style.display='none';document.getElementById('resultScreen').classList.add('show');}
  function retryQuiz(){attemptNumber++;startQuiz();}
  async function init(){await loadUser();startQuiz();}
  init();
</script>
</body>
</html>
