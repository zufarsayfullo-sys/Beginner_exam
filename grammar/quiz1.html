<!DOCTYPE html>
<html lang="en">
<head>

  <style>

      --purple-main:  #534AB7;

      --purple-light: #CECBF6;
      --purple-pale:  #EEEDFE;
      --teal-dark:    #085041;
      --teal-main:    #0F6E56;
      --teal-pale:    #E1F5EE;
      --coral-dark:   #712B13;
      --coral-main:   #993C1D;
      --coral-pale:   #FAECE7;
      --bg:           #F0EEF8;
      --radius:       14px;
      --radius-sm:    10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: var(--bg); }

    #app { height: 100%; display: flex; flex-direction: column; }

    /* HEADER */
    .header { background: var(--purple-main); padding: 10px 18px 16px; flex-shrink: 0; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .back-btn { display: flex; align-items: center; gap: 5px; color: var(--purple-light); font-size: 13px; cursor: pointer; text-decoration: none; }
    .back-btn i { font-size: 16px; }
    .home-btn { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.15); color: #fff; font-size: 12px; font-weight: 500; padding: 6px 13px; border-radius: 20px; cursor: pointer; text-decoration: none; }
    .home-btn i { font-size: 14px; }
    .progress-row { display: flex; align-items: center; gap: 10px; }
    .progress-track { flex: 1; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: #fff; border-radius: 3px; transition: width 0.4s ease; width: 0%; }
    .progress-label { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; min-width: 40px; text-align: right; }

    /* SCROLL */
    .scroll { flex: 1; overflow-y: auto; padding: 20px 16px 30px; -webkit-overflow-scrolling: touch; }
    .scroll::-webkit-scrollbar { width: 0; }

    /* QUESTION */
    .qtopic { font-size: 11px; font-weight: 600; color: var(--purple-main); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
    .qtext { font-size: 17px; font-weight: 600; color: var(--purple-dark); line-height: 1.55; margin-bottom: 6px; }
    .qcontext { font-size: 13px; color: #999; margin-bottom: 22px; font-style: italic; line-height: 1.5; }

    /* OPTIONS */
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .opt {
      background: #fff; border: 1.5px solid #E0DEFA; border-radius: var(--radius);
      padding: 14px 16px; display: flex; align-items: center; gap: 12px;
      cursor: pointer; transition: all 0.15s ease; user-select: none;
    }
    .opt.selected { border-color: var(--purple-main); background: var(--purple-pale); }
    .opt.correct  { border-color: var(--teal-main);   background: var(--teal-pale); pointer-events: none; }
    .opt.wrong    { border-color: var(--coral-main);  background: var(--coral-pale); pointer-events: none; }
    .opt.disabled { pointer-events: none; opacity: 0.5; }
    .opt-circle {
      width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--purple-light);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px;
      transition: all 0.15s ease;
    }
    .opt.selected .opt-circle { border-color: var(--purple-main); background: var(--purple-main); color: #fff; }
    .opt.correct  .opt-circle { border-color: var(--teal-main);   background: var(--teal-main);   color: #fff; }
    .opt.wrong    .opt-circle { border-color: var(--coral-main);  background: var(--coral-main);  color: #fff; }
    .opt-text { font-size: 15px; font-weight: 500; color: var(--purple-dark); }
    .opt.correct .opt-text { color: var(--teal-dark); }
    .opt.wrong   .opt-text { color: var(--coral-dark); }

    /* FEEDBACK */
    .feedback-box {
      border-radius: var(--radius-sm); padding: 12px 14px;
      display: flex; align-items: flex-start; gap: 9px;
      margin-bottom: 18px; display: none;
      animation: fadeUp 0.25s ease both;
    }
    .feedback-box.show { display: flex; }
    .feedback-box.correct-fb { background: var(--teal-pale); }
    .feedback-box.wrong-fb   { background: var(--coral-pale); }
    .fb-icon { font-size: 17px; flex-shrink: 0; }
    .fb-text { font-size: 13px; line-height: 1.55; }
    .feedback-box.correct-fb .fb-text { color: var(--teal-dark); }
    .feedback-box.wrong-fb   .fb-text { color: var(--coral-dark); }

    /* NEXT BTN */
    .next-btn {
      width: 100%; background: var(--purple-main); color: #fff; border: none;
      border-radius: var(--radius); padding: 15px; font-size: 15px; font-weight: 600;
      cursor: pointer; display: none; align-items: center; justify-content: center; gap: 8px;
      animation: fadeUp 0.25s ease both;
    }
    .next-btn.show { display: flex; }
    .next-btn i { font-size: 17px; }

    /* RESULT SCREEN */
    #resultScreen { display: none; flex-direction: column; height: 100%; }
    #resultScreen.show { display: flex; }
    .result-header { background: var(--purple-main); padding: 10px 18px 16px; flex-shrink: 0; }
    .result-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .result-scroll { flex: 1; overflow-y: auto; padding: 24px 18px 30px; display: flex; flex-direction: column; align-items: center; }
    .result-emoji { font-size: 54px; text-align: center; margin-bottom: 10px; }
    .result-title { font-size: 21px; font-weight: 700; color: var(--purple-dark); text-align: center; margin-bottom: 4px; }
    .result-sub { font-size: 13px; color: #999; text-align: center; margin-bottom: 24px; }
    .score-circle {
      width: 116px; height: 116px; border-radius: 50%;
      background: var(--purple-pale); border: 4px solid var(--purple-main);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .score-num { font-size: 32px; font-weight: 700; color: var(--purple-main); line-height: 1; }
    .score-lbl { font-size: 11px; color: #888; margin-top: 4px; }
    .result-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 24px; }
    .rstat { background: #fff; border-radius: var(--radius-sm); padding: 12px 10px; text-align: center; border: 0.5px solid #E0DEFA; }
    .rstat-val { font-size: 20px; font-weight: 700; }
    .rstat-lbl { font-size: 10px; color: #888; margin-top: 3px; }
    .rstat.c .rstat-val { color: var(--teal-main); }
    .rstat.w .rstat-val { color: var(--coral-main); }
    .rstat.a .rstat-val { color: var(--purple-main); }
    .result-btns { display: flex; flex-direction: column; gap: 9px; width: 100%; }
    .btn-retry { width: 100%; background: var(--purple-main); color: #fff; border: none; border-radius: var(--radius); padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .btn-back  { width: 100%; background: #fff; color: var(--purple-main); border: 1.5px solid var(--purple-light); border-radius: var(--radius); padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .btn-retry i, .btn-back i { font-size: 17px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  let answered      = false;

  let userId        = null;

  // ─── SUPABASE ───────────────────────────────────────────────────
  async function getTelegramId() {
    if (tg?.initDataUnsafe?.user) return String(tg.initDataUnsafe.user.id);
    return localStorage.getItem('dev_tg_id') || 'dev_user';
  }

  async function loadUser() {
    try {
      const tid = await getTelegramId();
      const { data } = await db.from('exam_users').select('id').eq('telegram_id', tid).single();
      userId = data?.id || null;
      if (userId) {
        const { data: attempts } = await db
          .from('exam_quiz_attempts')
          .select('id')
          .eq('user_id', userId)
          .eq('skill', 'grammar')
          .eq('quiz_id', 1);
        attemptNumber = (attempts?.length || 0) + 1;
      }
    } catch(e) { console.error(e); }
  }

  async function saveAttempt(score) {
    if (!userId) return;
    try {
      await db.from('exam_quiz_attempts').insert({
        user_id: userId, skill: 'grammar', quiz_id: 1, score
      });
      // Update exam_progress for grammar
      const { data: prog } = await db
        .from('exam_progress')
        .select('id, tasks_done, tasks_total')
        .eq('user_id', userId)
        .eq('skill', 'grammar')
        .single();
      if (prog) {
        await db.from('exam_progress')
          .update({ tasks_done: Math.max(prog.tasks_done, 1), updated_at: new Date().toISOString() })
          .eq('id', prog.id);
      } else {
        await db.from('exam_progress')
          .insert({ user_id: userId, skill: 'grammar', tasks_done: 1, tasks_total: 8 });
      }
    } catch(e) { console.error(e); }
  }

  // ─── QUIZ LOGIC ─────────────────────────────────────────────────
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startQuiz() {
    questions = shuffle(ALL_QUESTIONS).slice(0, 10);
    current   = 0;
    correct   = 0;
    answered  = false;
    document.getElementById('quizScreen').style.display  = 'flex';
    document.getElementById('quizScreen').style.flexDirection = 'column';
    document.getElementById('quizScreen').style.height   = '100%';
    document.getElementById('resultScreen').classList.remove('show');
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = questions[current];
    const pct = (current / 10) * 100;

    document.getElementById('progressFill').style.width  = pct + '%';
    document.getElementById('progressLabel').textContent = current + ' / 10';
    document.getElementById('qtext').textContent         = q.q;

    const feedbackBox = document.getElementById('feedbackBox');
    feedbackBox.className = 'feedback-box';
    feedbackBox.classList.remove('show');

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.classList.remove('show');

    // Shuffle options
    const opts = shuffle(q.options);
    const container = document.getElementById('optionsEl');
    container.innerHTML = '';
    opts.forEach(opt => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.innerHTML = `<div class="opt-circle"></div><span class="opt-text">${opt}</span>`;
      div.addEventListener('click', () => selectAnswer(opt, q));
      container.appendChild(div);
    });

    // Scroll to top
    document.getElementById('quizScroll').scrollTo({ top: 0, behavior: 'smooth' });
  }

  function selectAnswer(chosen, q) {
    if (answered) return;
    answered = true;

    const isCorrect = chosen === q.correct;
    if (isCorrect) correct++;

    // Style options
    document.querySelectorAll('.opt').forEach(el => {
      const text = el.querySelector('.opt-text').textContent;
      if (text === q.correct) {
        el.classList.add('correct');
        el.querySelector('.opt-circle').innerHTML = '<i class="ti ti-check" style="font-size:12px;"></i>';
      } else if (text === chosen && !isCorrect) {
        el.classList.add('wrong');
        el.querySelector('.opt-circle').innerHTML = '<i class="ti ti-x" style="font-size:12px;"></i>';
      } else {
        el.classList.add('disabled');
      }
    });

    // Feedback
    const fb = document.getElementById('feedbackBox');
    fb.className = 'feedback-box show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
    document.getElementById('fbIcon').textContent  = isCorrect ? '✅' : '❌';
    document.getElementById('fbText').innerHTML    = q.explanation;

    // Next btn label
    const nextBtn = document.getElementById('nextBtn');
    nextBtn.classList.add('show');
    nextBtn.innerHTML = current < 9
      ? 'Next question <i class="ti ti-arrow-right"></i>'
      : 'See results <i class="ti ti-trophy"></i>';

    // Scroll to show feedback
    setTimeout(() => {
      document.getElementById('quizScroll').scrollTo({ top: 999, behavior: 'smooth' });
    }, 150);
  }

  function nextQuestion() {
    current++;
    if (current >= 10) {
      showResult();
    } else {
      renderQuestion();
    }
  }

  async function showResult() {
    const score = Math.round((correct / 10) * 100);
    await saveAttempt(score);

    document.getElementById('progressFill').style.width  = '100%';
    document.getElementById('progressLabel').textContent = '10 / 10';

    document.getElementById('resultEmoji').textContent   = score >= 80 ? '🎉' : score >= 60 ? '👍' : '💪';
    document.getElementById('resultSub').textContent     = `There is / There are · Attempt ${attemptNumber}`;
    document.getElementById('scoreNum').textContent      = score + '%';
    document.getElementById('resCorrect').textContent    = correct;
    document.getElementById('resWrong').textContent      = 10 - correct;
    document.getElementById('resAttempts').textContent   = attemptNumber;

    document.getElementById('quizScreen').style.display = 'none';
    document.getElementById('resultScreen').classList.add('show');
  }

  function retryQuiz() {
    attemptNumber++;
    startQuiz();
  }

  // ─── INIT ────────────────────────────────────────────────────────
  async function init() {
    await loadUser();
    startQuiz();
  }

  init();

    const _db2=window.supabase.createClient('https://wfpphviaosfedotbivtb.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHBodmlhb3NmZWRvdGJpdnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjI0MzgsImV4cCI6MjA5NTYzODQzOH0.HyY11YK2hjmRogCGMKcB_s6EpwGM7OQbFtR7HNTLryQ');
    let _uid=null,_start=Date.now();
    async function _getUid(){if(_uid)return _uid;const tg=window.Telegram?.WebApp?.initDataUnsafe?.user;const tid=tg?String(tg.id):'dev_user';const{data}=await _db2.from('exam_users').select('id').eq('telegram_id',tid).single();_uid=data?.id;return _uid;}

    // Fix back button to return to quiz join page
    document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('a.back-btn').forEach(b=>{const h=b.getAttribute('href');if(h&&h.includes('index.html'))b.setAttribute('href','../quiz/index.html');});});
  })();
</script>
